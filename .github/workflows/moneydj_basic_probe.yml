name: "探測：MoneyDJ 基本資料頁真實樣本（只讀，手動／按鈕分支觸發）"

# 目的：取 MoneyDJ 基本資料頁（yp011000／yp011001 × tcbbankfund／www）的真實回應，驗證
# `repositories/fund/declared_profile.py::fetch_moneydj_basic_fields` 的解析，以及
# 「代碼以詞界出現在含『基金名稱』那張表自身文字」能否作為 C2 的身分綁定規則。
# 開發環境連 MoneyDJ 可能 403，故在 Actions 上取真實回應、寫成報告（含 gzip＋base64 的原始 HTML）。
# 結構照抄 `fx_obs_date_probe.yml`，只改必要處（名稱、分支、腳本、報告路徑、逾時、無輸入參數）。
#
# ⚠️ 只讀：不寫任何試算表、不碰使用者設定、不改正式行為；報告只推到專用分支
#    `probe/moneydj-basic-results`（**不推 main、不推其他分支、不 force**）。
# ⚠️ 沒有排程。觸發方式只有兩種：
#    (1) 手動 `workflow_dispatch`（沒有輸入參數：代碼清單寫在腳本裡，不接受使用者輸入）；
#    (2) push 到「按鈕分支」`probe/moneydj-basic-trigger`
#        （部分整合環境呼叫 dispatch API 會回 403，同 fx 那支的理由）。
#
# ⛔ 按鈕分支只當「按鈕」用 —— 它的內容不被執行，執行的永遠是 main：
#    - 探測步驟以 `actions/checkout` 指定 `ref: main`；往按鈕分支推入改過的腳本，**不會**被執行。
#    - 觸發分支 ≠ 報告分支；報告分支不在 push 觸發清單內 → 不會自我觸發迴圈。
#    - 報告分開記 `trigger_sha`（觸發那顆 commit）與 `executed_sha`（checkout 後 `git rev-parse HEAD`）。
#    ⚠️ 據實揭露 `ref: main` 擋不到的一件事（同 fx 那支）：push 事件執行的是「被推的那顆 commit 裡的
#       這份 workflow 檔」本身。能推按鈕分支、且能改 workflow 檔的人，可以連這份 yml 一起改掉。
#    用法：按鈕分支請從 main 建立、上面不放任何改動
#    （例：`git fetch origin main` 後 `git push origin origin/main:refs/heads/probe/moneydj-basic-trigger`；
#    再跑一次就推 main 的新 SHA 或一顆空 commit）。
#    ⚠️ 本 workflow 必須先合併進 main，按鈕分支觸發的 run 才會執行 main 上的腳本。
#
# 📌 報告大小未實測：每頁原始 HTML 以 gzip＋base64 內嵌，頁數上限為（8 個代碼 ＋ 1 個負控）× 4 個網址；
#    以第一次真跑為準。
on:
  push:
    branches:
      - probe/moneydj-basic-trigger
  workflow_dispatch:

permissions:
  contents: write   # 只為了把報告推到 probe/moneydj-basic-results

concurrency:
  group: moneydj-basic-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # 請求數上限約 9 代碼 ×（4 個原始頁 ＋ 公開函式最多 4 個 MoneyDJ 網址 ＋ 1 個 FundClear）＋ 1 個 TDCC，
    # 每個請求最長約 20 秒（timeout=20、retries=1），另加每次 1.5 秒間隔；退避冷卻會跳過部分請求。
    timeout-minutes: 40
    env:
      RESULT_BRANCH: probe/moneydj-basic-results
      REPORT_PATH: probe_out/moneydj_basic_report.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ⛔ 一律跑 main 上的腳本（見檔頭）。
          ref: main
          # 不把 token 留在 .git/config：探測步驟拿不到推送權限；只有最後推送那一步臨時注入認證。
          persist-credentials: false

      - name: Record executed SHA
        run: echo "PROBE_EXECUTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        # 腳本借用正式的 `declared_profile`（經 `fund_fetcher` 間接載入 streamlit 與 services）→ 裝完整 requirements。
        run: pip install -r requirements.txt

      - name: Run probe
        env:
          # 照抄 fx_obs_date_probe.yml；`infra.proxy.get_proxy_config()` 讀的是 `st.secrets`，不讀環境變數，
          # 報告的 `proxy_used_by_infra` 會如實記錄這次到底有沒有走代理。
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/probe_moneydj_basic_page.py --out "$REPORT_PATH"

      - name: Commit report to probe/moneydj-basic-results
        # 探測失敗（一頁都沒取到）時報告照樣寫出，失敗原文也要留下來 → always()。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "$REPORT_PATH" ]; then
            echo "::error::報告檔不存在（$REPORT_PATH），沒有可提交的東西"
            exit 1
          fi
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          agit() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" "$@"; }
          STAMP="$(date -u '+%Y%m%dT%H%M%SZ')_run${GITHUB_RUN_ID}"
          mkdir -p "$RUNNER_TEMP/mdjprobe"
          cp "$REPORT_PATH" "$RUNNER_TEMP/mdjprobe/report.json"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clean -fdxq
          if agit ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null; then
            agit fetch --depth=1 origin "$RESULT_BRANCH"
            git checkout -B "$RESULT_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$RESULT_BRANCH"
            git rm -rfq .
          fi
          mkdir -p "results/$STAMP"
          cp "$RUNNER_TEMP/mdjprobe/report.json" "results/$STAMP/report.json"
          git add "results/$STAMP/report.json"
          git commit -m "探測：MoneyDJ 基本資料頁 ${STAMP} [skip ci]"
          agit push origin "HEAD:refs/heads/$RESULT_BRANCH"
          echo "報告已推到 $RESULT_BRANCH：results/$STAMP/report.json"
