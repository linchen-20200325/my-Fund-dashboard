name: "除息行事曆 月初摘要 (LINE)"

# 每月月初對「持倉 ∪ 追蹤清單」推估**下個月**除息日(遇六日/國定假日順延營業日)+ 到帳區間
# (除息 +5~7 營業日)→ 推一張**月曆圖檔 + 圖下方文字清單**到 LINE。
# 圖 = 截 App「我的管理室 → 除息行事曆」同一份 HTML,兩邊同源。
# 產圖/發佈/推圖任一步失敗 → 自動退 Flex 彩色卡片 → 再退純文字,提醒一定送達(§1)。
# ⚠️ cron 是 UTC。台灣 = UTC+8。 0 0 1 * * = 每月 1 號 00:00 UTC = 1 號 08:00 台灣。
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印不送 (true/false)"
        default: "true"

concurrency:
  group: dividend-calendar-notify
  cancel-in-progress: false

permissions:
  # 月曆 PNG 需發佈到 push-assets 分支才能取得 LINE 可讀的公開網址(infra/asset_publish)。
  # 沒有這行 → Contents API PUT 會 403 → 自動退回 Flex 卡片(提醒仍送達,但沒有圖)。
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Install Chromium + 中文字型（月曆 PNG 用）
        # 產圖走 headless Chromium 截 App 那份 HTML(infra/html_to_png)。
        # fonts-noto-cjk 缺 → 整張圖會變成 tofu 方塊,html_to_png 的 require_cjk 探針會擋下並
        # 讓推播退回 Flex(§1 不推無法閱讀的圖),故字型與瀏覽器一樣是必裝。
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run monthly dividend-calendar LINE summary
        env:
          # asset_publish 用:發佈月曆 PNG 到 push-assets 分支換取公開圖片網址
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          google_service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          macro_weights_sheet_id: ${{ secrets.MACRO_WEIGHTS_SHEET_ID }}
          # 持倉自 v19.462 起存 POLICY_SHEET_ID 那本;_load_client_and_sheet 優先讀它(未設才退
          # macro_weights)。缺此 → 持倉讀 macro_weights 本(可能 404/空)→ 只剩追蹤清單。與週報同步補。
          POLICY_SHEET_ID: ${{ secrets.POLICY_SHEET_ID }}
          WATCH_CSV_URL: ${{ secrets.WATCH_CSV_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: >
          python scripts/dividend_calendar_notify.py
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
