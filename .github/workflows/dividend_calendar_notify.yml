name: "除息行事曆 月底摘要 (LINE)"

# 每月**月底**對「持倉 ∪ 追蹤清單」推估**下個月**除息日(遇六日/國定假日順延營業日)+ 到帳區間
# (除息 +5~7 營業日)→ 推一張**月曆圖檔 + 圖下方文字清單**到 LINE。
# 圖 = 截 App「我的管理室 → 除息行事曆」同一份 HTML,兩邊同源。
# 產圖/發佈/推圖任一步失敗 → 自動退 Flex 彩色卡片 → 再退純文字,提醒一定送達(§1)。
#
# ⚠️⚠️ **「28 號」與「推下個月」是一組配對,改一邊必須改另一邊**(v19.537 事故成因):
#   2026-08-13 建這條 workflow 時是「1 號發**本月**」;2026-08-24 commit 2ec9819(PR #705)
#   把目標月改成**下個月**,cron 卻沒跟著改 → 變成「1 號發下個月」,user 2026-09-01 裁示
#   「絕對不會是月初發布下個月」。且 8/1 workflow 還不存在、9/1 那次送的是 10 月 →
#   **2026 年 9 月的行事曆永遠不會被自動送出**(補送走 workflow_dispatch 的 target_month)。
#   → 只准兩種配對:**月底發下個月**(現行)或 **月初發本月**。`tests/test_dividend_calendar_cron_v19537.py`
#     鎖住 cron 字面值,漂移即紅燈。
#
# ⚠️ cron 是 UTC。台灣 = UTC+8。 `23 0 28 * *` = 每月 28 號 00:23 UTC = **28 號 08:23 台灣**。
#   **為什麼是 28 號**:2 月沒有 29~31 號,固定 28 號才保證每月觸發**恰好一次**,
#     不必再寫「今天是不是當月最後一天」的判斷(29/30/31 號會讓 2 月整月漏發)。
#   **為什麼分鐘取 23 而非 0**:GitHub 官方文件明列排程在**每個整點**為高負載時段,會延遲
#     甚至**直接丟棄**佇列中的 job。本 repo 實測同為 00:00 UTC 的 update_macro_history.yml:
#     13 次觸發沒有一次在 62 分鐘內起跑(中位數 144 分鐘、最長 693 分鐘)。錯開整點可大幅降低。
on:
  schedule:
    - cron: "23 0 28 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印不送 (true/false)"
        default: "true"
      target_month:
        # 補送用(例:9 月那次因上述 cron/目標月不同步而從未送出 → 填 2026-09 手動補)。
        # ⚠️ 格式不合法一律**報錯離開**,不會靜默退回「下個月」——
        #    那會讓你以為補送成功、實際收到另一個月(§1 最糟的失敗模式)。
        description: "指定月份 YYYY-MM(留空 = 下個月)"
        default: ""

concurrency:
  group: dividend-calendar-notify
  cancel-in-progress: false

permissions:
  # 月曆 PNG 需發佈到 push-assets 分支才能取得 LINE 可讀的公開網址(infra/asset_publish)。
  # 沒有這行 → Contents API PUT 會 403 → 自動退回 Flex 卡片(提醒仍送達,但沒有圖)。
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Install Chromium + 中文字型（月曆 PNG 用）
        # 產圖走 headless Chromium 截 App 那份 HTML(infra/html_to_png)。
        # fonts-noto-cjk 缺 → 整張圖會變成 tofu 方塊,html_to_png 的 require_cjk 探針會擋下並
        # 讓推播退回 Flex(§1 不推無法閱讀的圖),故字型與瀏覽器一樣該裝。
        #
        # ⚠️ `continue-on-error: true` 是**刻意的**(稽核 HIGH-1):本步驟會抓 ~170MB 瀏覽器,
        # Playwright CDN / apt mirror 抖一下就整步失敗。若讓它中止 job,Python 那條
        # 「圖 → Flex → 純文字」三段降級鏈**根本沒機會執行** → 當月完全收不到通知,
        # 而 cron 是月排程,下次要等 30 天。這正是降級鏈要防的情境(§1)。
        # 裝不起來時 Python 端會自己發現(html_to_png 找不到 playwright/Chromium)並退 Flex,
        # 提醒照樣送達 —— 只是沒有圖。故本步驟為「best-effort」,不可成為硬門檻。
        continue-on-error: true
        run: |
          python -m pip install 'playwright>=1.40'   # 與 requirements-dev.txt 同下限(§5 可重現)
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run monthly dividend-calendar LINE summary
        env:
          # asset_publish 用:發佈月曆 PNG 到 push-assets 分支換取公開圖片網址
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          google_service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          macro_weights_sheet_id: ${{ secrets.MACRO_WEIGHTS_SHEET_ID }}
          # 持倉自 v19.462 起存 POLICY_SHEET_ID 那本;_load_client_and_sheet 優先讀它(未設才退
          # macro_weights)。缺此 → 持倉讀 macro_weights 本(可能 404/空)→ 只剩追蹤清單。與週報同步補。
          POLICY_SHEET_ID: ${{ secrets.POLICY_SHEET_ID }}
          WATCH_CSV_URL: ${{ secrets.WATCH_CSV_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # ⚠️ **安全**:target_month 是 user 可控字串,**絕不可**用 ${{ }} 插進下面 run: 的
          # 指令列(GitHub Actions script injection —— 插值是在 shell 之前做字串代換,
          # 填 `; rm -rf …` 就會被當指令跑)。一律走 env,由 Python 端讀 os.environ。
          # (既有 dry_run 那條插值只會產出固定字面值 `--dry-run` 或 `''`,不含 user 輸入,安全。)
          # schedule 觸發時 inputs 為 null → 這個 env 會是空字串 → Python 端視為「未指定」→ 下個月。
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
        run: >
          python scripts/dividend_calendar_notify.py
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
