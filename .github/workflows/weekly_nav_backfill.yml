name: "每日 NAV 自動補齊 (nav_history)"

# v19.495(user 2026-08-20「基金淨值請於每天淨值確定後抓取」):週更 → **每日**。
# 每天對「持倉 ∪ 選股池」跑 backfill_to_gs,把最新可得淨值 append 進雲端 nav_history。
# 走 GitHub Actions(**美國 IP**)—— LU 檔的 ISIN→Yahoo secId→chart 只有美國 IP 抓得到
# (台灣 IP 被擋);TW000 檔靠 MoneyDJ 增量。與 App「一鍵補抓」同一條 L2,(code,date) 冪等
# → 每日重跑只 append 當天新確定的淨值,週末/假日無新值時是 no-op(不灌重複)。
#
# ⚠️ cron 是 UTC。台灣 = UTC+8。
#   0 12 * * * = 每天 12:00 UTC = 每天 20:00 台灣(NAV T+1 傍晚已確定;排在健康週報之後)。
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列將補的代號,不抓取/不寫入 (true/false)"
        default: "true"

concurrency:
  group: weekly-nav-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      # ⛔ 暫時性診斷步驟（事故 P0 一手證據用，唯讀，取證後即以另一個 commit 移除）。
      # 只讀 gridProperties / 表頭，**不寫入任何一格**。
      - name: "TEMP DIAG (read-only) nav_history gridProperties"
        env:
          google_service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          NAV_SHEET_ID: ${{ secrets.NAV_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          from infra.config import get_secret
          from repositories.policy_repository import get_gspread_client
          from services.nav_history_gs import _nav_sheet_id, _WS_NAV, _NAV_HEADERS
          cl = get_gspread_client(get_secret("google_service_account"))
          sh = cl.open_by_key(_nav_sheet_id())
          print("DIAG expected_headers_len:", len(_NAV_HEADERS))
          for w in sh.worksheets():
              print("DIAG worksheet:", json.dumps(
                  {"title": w.title, "rowCount": w.row_count, "colCount": w.col_count},
                  ensure_ascii=False))
          ws = sh.worksheet(_WS_NAV)
          print("DIAG gridProperties:", json.dumps(
              ws._properties.get("gridProperties"), ensure_ascii=False))
          hdr = ws.row_values(1)
          print("DIAG header_len:", len(hdr))
          print("DIAG header:", json.dumps(hdr, ensure_ascii=False))
          PY

      - name: Run weekly NAV backfill (持倉 ∪ 選股池 → nav_history)
        # 排程時 inputs.dry_run 為空 → 不加旗標 → **實抓實寫**;手動 dispatch 填 true 才 --dry-run。
        env:
          google_service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          # NAV_SHEET_ID:nav_history 目標本(未設走程式 baked 預設)。
          NAV_SHEET_ID: ${{ secrets.NAV_SHEET_ID }}
          # 讀持倉/選股池:優先 POLICY_SHEET_ID(App 寫這本的 _fund_pool),退 macro_weights。
          POLICY_SHEET_ID: ${{ secrets.POLICY_SHEET_ID }}
          macro_weights_sheet_id: ${{ secrets.MACRO_WEIGHTS_SHEET_ID }}
          # 選填:美國 IP 抓不到 MoneyDJ 時走 NAS 代理。
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: >
          python scripts/weekly_nav_backfill.py
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
