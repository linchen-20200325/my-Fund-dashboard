name: "PR Check（pre-commit + AppTest）"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR 重複推 commit 時，取消前一輪未跑完的 runs
# ⚠️ push 到 main 例外：group 尾端補上 github.sha，讓每顆 merge commit 自成一組。
#    原本 push 事件的 github.ref 恆為 refs/heads/main，連續兩次合併會共用同一組 →
#    後一次合併的 push 取消前一次尚未跑完的 main run（實例：run 34107180350，
#    head_sha d60910f，Fast checks 與 Slow tests 皆 cancelled）。那會讓「merge 完
#    回頭逐 job 驗 main 那一次 CI run」結構上跑不完，且沒有人會察覺；run-level 顯示
#    cancelled 又長得像失敗（本 repo 紀律：cancelled ≠ success）。
#    PR 事件走 'shared' → group 在同一個 PR 內維持穩定，新 push 取消舊 run 的省時行為保留。
#    守衛：tests/test_ci_concurrency_main_push_guard.py
concurrency:
  group: pr-check-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════
  # Fast lane — pre-commit 全套（含 pytest -m "not slow"）
  # 失敗即阻擋 merge
  # ════════════════════════════════════════════════════════════
  fast-checks:
    name: "Fast checks (pre-commit + pytest, ~30s)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pre-commit (含 pytest-smoke fast lane)
        run: pre-commit run --all-files --show-diff-on-failure

  # ════════════════════════════════════════════════════════════
  # Schema gate — A1 Phase D v19.165
  # 純 pandera schema tests,獨立 job 讓 schema regression 在 PR 視圖
  # 一眼可見(不混在通用 pytest 結果裡)。失敗即阻擋 merge。
  # CLAUDE.md §3.1 守:fetcher 出口 + service 入口契約不可飄移。
  # ════════════════════════════════════════════════════════════
  schema-gate:
    name: "Schema gate (pandera contracts, ~5s)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pandera schema tests
        run: |
          python -m pytest -v \
            tests/test_schemas_phase_a.py \
            tests/test_schemas_phase_b.py \
            tests/test_schemas_phase_b2_fund_nav.py \
            tests/test_schemas_phase_b3_dividends.py \
            tests/test_schemas_phase_b_foreign_flow.py \
            tests/test_schemas_phase_c.py \
            tests/test_schemas_phase_d.py \
            --tb=short

  # ════════════════════════════════════════════════════════════
  # Slow lane — AppTest（單測約 25s）＋ tests/ui_v2 畫面測試（AppTest 與真瀏覽器）
  # 非阻擋（continue-on-error），僅作為 informational signal
  # 原因：Streamlit AppTest 可能偶發 timeout / 外部資源故障
  # ⚠️ 也就是說：tests/ui_v2 的瀏覽器測試在這裡紅了，**不會擋合併** —— 要看這條 job 的結果才知道。
  #    tests/ui_v2/test_*_page.py 整檔標 slow（2026-09-25 客戶裁示），fast lane 不跑它們。
  # ════════════════════════════════════════════════════════════
  slow-tests:
    name: "Slow tests (AppTest, informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: fast-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # tests/ui_v2 的瀏覽器測試用 playwright 預設解析找 Chromium（playwright 由 requirements-dev.txt 裝）。
      # CI（CI=true，GitHub Actions 自動設定）找不到瀏覽器時測試 fail、不 skip —— 見 tests/ui_v2/_ui_v2_chromium.py。
      # 守衛：tests/ui_v2/test_ui_v2_lane_guards.py
      - name: Install Chromium for ui_v2 browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run AppTest (slow lane)
        env:
          # AppTest fixture 已在程式中設假 secret，這裡是雙保險
          FRED_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
        run: python -m pytest -v -m "slow" --tb=short

  # ════════════════════════════════════════════════════════════
  # Visual Fidelity safety net — CI deterministic screenshot（BL-0525 Batch A；`DEC-2026-10-29-07`）
  # ⚠️ CI fixture screenshot ≠ production-like Cloud screenshot：本 job 的截圖只代表「CI 固定 fixtures 渲染出的畫面」，
  #    是 automated safety net，**不是** Visual Fidelity Gate 的正式確認（正式確認＝B 線預覽站的 production-like Cloud screenshot，
  #    見 tests/visual_fidelity/vf_config.py 與 docs/v2/71 第七節）。兩者不得互相冒充。
  # 非阻擋（continue-on-error）：理由同 slow lane —— 瀏覽器截圖可能受字型／渲染環境影響偶發差異，且今天的頁面尚未套用
  #    Presentation Contract（Batch C～F 才套用），hard 檢查（例外、程式碼區塊外露、水平溢出）以外的契約缺口只寫進報告、不轉紅。
  #    也就是說：這條 job 紅了**不會擋合併** —— 要看這條 job 的結果才知道。
  # 不使用任何外部網路取數：情境全是固定 fixtures／替身（同 tests/ui_v2/test_live_390_page.py）。
  # 守衛：tests/visual_fidelity/test_workflow_logic.py
  # ════════════════════════════════════════════════════════════
  visual-fidelity-safety-net:
    name: "Visual Fidelity safety net (CI fixture screenshots, informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: fast-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Capture CI fixture screenshots + layout checks
        env:
          VISUAL_FIDELITY_OUT: ${{ github.workspace }}/visual-fidelity-out/ci-fixture
          FRED_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
        run: python -m pytest tests/visual_fidelity/test_ci_fixture_screenshots.py -v -m "slow" --tb=short

      - name: Print layout-check report to job summary (CI fixture; NOT production-like)
        if: always()
        run: |
          f=visual-fidelity-out/ci-fixture/ci-fixture__report.md
          if [ -f "$f" ]; then cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no report file"; fi

      - name: Upload CI fixture screenshots (NOT production-like)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixture-screenshots-NOT-production-cloud
          path: visual-fidelity-out/ci-fixture/
          if-no-files-found: warn
          retention-days: 14

      # production-like Cloud capture：預設不跑（只在手動 workflow_dispatch 時嘗試）；網路被擋時腳本印出
      # 「production-like Cloud capture blocked by current environment network policy」並 exit 0，不當成失敗。
      - name: Cloud capture (manual dispatch only; production-like)
        if: github.event_name == 'workflow_dispatch'
        run: python tests/visual_fidelity/cloud_capture.py --out visual-fidelity-out/cloud

      - name: Upload Cloud screenshots (production-like)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-preview-screenshots-production-like
          path: visual-fidelity-out/cloud/
          if-no-files-found: warn
          retention-days: 14
