[pytest]
markers =
    slow: Streamlit AppTest 等 runtime e2e（單測 >5s）；預設於 pre-commit 跳過
    playwright: 真實瀏覽器 e2e（需 streamlit 已啟動 + chromium 已安裝）；需 -m playwright
        ⚠️ v19.429 現況盤點：本組**實質未啟用**，不提供任何視覺回歸保護。
           三道關卡任一即整組 skip：
             1. `pytest.importorskip("playwright.sync_api")` — 未 pip install playwright
             2. `browser_context` fixture — 未執行 `playwright install chromium`
             3. 測試需 localhost:8501 有 streamlit 在跑
           CI 兩條 lane 都跑不到：fast lane `-m "not slow"` 已排除；
           slow lane 雖裝 requirements-dev.txt，但未裝 chromium、未起 server。
           且 `tests/__snapshots__/` **不存在**（從未 commit 任何 baseline PNG）
           → 即使跑起來也無基準可比，第一次只會寫檔。
           **改 UI 不需要更新 baseline**，不要被檔案 docstring 的執行流程誤導。
           要真正啟用需：pip install playwright + playwright install chromium
           + 起 streamlit + 跑一次 --update-snapshots 產生並 commit baseline
           + CI 補上述步驟。屬 §-1「沒具體需求不要動」，等實際需要視覺回歸再評估。
addopts = --strict-markers
